  <rect x="504" y="614" width="176" height="56" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="592" y="647" text-anchor="middle" fill="#134e4a" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">속도 제한</text>
  <rect x="696" y="614" width="176" height="56" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="784" y="647" text-anchor="middle" fill="#134e4a" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">인가</text>
  <rect x="888" y="614" width="192" height="56" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="984" y="647" text-anchor="middle" fill="#134e4a" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700">입력 허용 목록</text>

  <line x1="360" y1="710" x2="360" y2="742" stroke="#44403c" stroke-width="1.5"/>
  <polygon points="360,750 354,738 366,738" fill="#44403c"/>
  <line x1="840" y1="710" x2="840" y2="742" stroke="#44403c" stroke-width="1.5"/>
  <polygon points="840,750 834,738 846,738" fill="#44403c"/>

  <rect x="120" y="756" width="480" height="132" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.25"/>
  <text x="360" y="788" text-anchor="middle" fill="#1c1917" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="700">SQLite 볼륨</text>
  <text x="360" y="814" text-anchor="middle" fill="#57534e" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="14">/data/blog.db</text>
  <text x="360" y="838" text-anchor="middle" fill="#57534e" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="14">게시 데이터 · 기존 행은 다시 쓰지 않음</text>
  <text x="360" y="862" text-anchor="middle" fill="#57534e" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="13">스키마 마이그레이션은 바꾸지 않음</text>

  <rect x="640" y="756" width="440" height="132" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.25"/>
  <text x="860" y="788" text-anchor="middle" fill="#1c1917" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="700">정적 vendor 자산</text>
  <text x="860" y="814" text-anchor="middle" fill="#57534e" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="14">/static/vendor/ · 같은 출처</text>
  <text x="860" y="838" text-anchor="middle" fill="#57534e" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="14">Three 0.170.0 · Quill 2.0.3</text>
  <text x="860" y="862" text-anchor="middle" fill="#57534e" font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif" font-size="14">Sortable 1.15.6 · script-src 는 'self'</text>
